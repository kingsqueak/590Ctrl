name: Packages

# Builds the universal macOS DMG, deb, RPM and Arch packages for x86-64 and arm64,
# and the Windows installer.
# Runs on a version tag (v*) or by hand; the packages are the run's artifacts.
# By hand, "only" limits the run to one job; a release needs all of them.
# Every package carries the DeepCW decoder (its model and ONNX Runtime): macOS,
# Linux and Windows. Each package script fetches ONNX Runtime and fails if the
# model or the library is missing from what it built; keep it that way.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only:
        description: Build one kind of package only (a test build for one system)
        type: choice
        default: all
        options: [all, deb, linux, windows, dmg]

permissions:
  contents: read

jobs:
  deb:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'deb' }}
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev file \
            qt6-base-dev qt6-serialport-dev qt6-websockets-dev qt6-multimedia-dev

      - name: Test and build the package
        run: ./scripts/make-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: 590ctrl-deb-${{ runner.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # The deb uses Ubuntu's Qt. These carry the official Qt, and are built on an
  # older Ubuntu so they run on distributions with an older glibc.
  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, host: linux, qt: linux_gcc_64, dir: gcc_64, docker: true }
          - { runner: ubuntu-24.04-arm, host: linux_arm64, qt: linux_gcc_arm64, dir: gcc_arm64, docker: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.12.0 and the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig-dev libfreetype-dev libdbus-1-dev \
            libxcb-cursor0 libpulse0 libpulse-mainloop-glib0 ruby rpm libarchive-tools zstd patchelf
          sudo gem install --no-document fpm
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt ${{ matrix.host }} desktop 6.12.0 ${{ matrix.qt }} \
            -m qtserialport qtwebsockets qtmultimedia -O "$RUNNER_TEMP/Qt"

      - name: Build the packages
        run: ./scripts/make-linux.sh "$RUNNER_TEMP/Qt/6.12.0/${{ matrix.dir }}"

      - name: Install and start them on Fedora and Arch
        if: ${{ matrix.docker }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -ec '
            dnf install -y -q xorg-x11-server-Xvfb xorg-x11-xauth /dist/*.rpm
            set +e; timeout 10 xvfb-run -a /usr/bin/590Ctrl; test $? = 124'
          docker run --rm -v "$PWD/dist:/dist:ro" archlinux:base sh -ec '
            pacman -Syu --noconfirm -q > /dev/null
            pacman -S --noconfirm -q xorg-server-xvfb xorg-xauth > /dev/null
            pacman -U --noconfirm /dist/*.pkg.tar.zst > /dev/null
            set +e; timeout 10 xvfb-run -a /usr/bin/590Ctrl; test $? = 124'

      - uses: actions/upload-artifact@v4
        with:
          name: 590ctrl-linux-${{ runner.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      # aqt can't yet find Qt 6.11 and 6.12's Windows files, which moved on Qt's server.
      - name: Install Qt 6.10.3
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/Scripts/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/Scripts/aqt" install-qt windows desktop 6.10.3 win64_msvc2022_64 \
            -m qtserialport qtwebsockets qtmultimedia -O "$RUNNER_TEMP/Qt"

      - name: Test and build
        shell: bash
        run: ./scripts/make-windows.sh "$(cygpath -m "$RUNNER_TEMP/Qt/6.10.3/msvc2022_64")"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $dir = (Get-Item build-win/stage/590Ctrl-*).FullName
          $ver = $dir -replace '^.*590Ctrl-', ''
          & $iscc /Q "/DAppVersion=$ver" "/DSourceDir=$dir" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed: $LASTEXITCODE" }
          Get-Item dist/*-setup.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: 590ctrl-windows-x64
          path: dist/*-setup.exe
          if-no-files-found: error

      # The installer is what gets tested: install, start, uninstall.
      - name: Install it
        shell: pwsh
        run: |
          $setup = (Get-Item dist/*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\590Ctrl"
          foreach ($f in 'bin\590Ctrl.exe', 'bin\onnxruntime.dll', 'bin\DeepCw\model.onnx', 'unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "installer left out $f" }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\590Ctrl.lnk")) { throw 'no Start menu entry' }
          Write-Host "installed in $dir"

      - name: Start it
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 "$env:LOCALAPPDATA\Programs\590Ctrl" "$pwd/windows-screenshot.png"

      - name: Uninstall it
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\590Ctrl"
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\bin\590Ctrl.exe") { throw 'uninstall left the program behind' }
          Write-Host 'uninstalled'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: windows-screenshot.png

  dmg:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'dmg' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The official Qt, as for a local release: Homebrew's can't target the
      # minimum macOS.
      - name: Install Qt 6.12.0
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop 6.12.0 clang_64 \
            -m qtserialport qtwebsockets qtmultimedia -O "$RUNNER_TEMP/Qt"
          command -v ninja || brew install ninja

      # For the DeepCW decoder.
      - name: Fetch ONNX Runtime
        run: ./scripts/fetch-onnxruntime.sh osx-arm64

      - name: Build the DMG
        run: ./scripts/make-dmg.sh "$RUNNER_TEMP/Qt/6.12.0/macos"

      - uses: actions/upload-artifact@v4
        with:
          name: 590ctrl-dmg
          path: build-release/*.dmg
          if-no-files-found: error
