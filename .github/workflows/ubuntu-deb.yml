name: Ubuntu package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev file \
            qt6-base-dev qt6-serialport-dev qt6-websockets-dev qt6-multimedia-dev

      - name: Test and build the package
        run: ./scripts/make-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: 590ctrl-deb-${{ runner.arch }}
          path: dist/*.deb
          if-no-files-found: error
